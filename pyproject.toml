[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbl-prediction"
version = "0.1.0"
description = "Pre-match win probability and powerplay-run distributions for Melbourne Renegades v Sydney Sixers (BBL|16)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F"]
# The pipeline modules are scripts that deliberately share state via star-imports.
ignore = ["F403", "F405", "F401", "F841", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
